services:
  mongo:
    image: mongo:7
    container_name: lab-mongo
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo-init:
    image: mongo:7
    container_name: lab-mongo-init
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    command: ["mongosh", "--host", "mongo:27017", "--quiet", "--eval", "try { rs.status() } catch(e) { rs.initiate({_id:'rs0', members:[{_id:0, host:'mongo:27017'}]}) }"]

  redis:
    image: redis/redis-stack-server:latest
    container_name: lab-redis
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 10s
      timeout: 5s
      retries: 10

  seed:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: lab-seed
    working_dir: /workspace
    volumes:
      - ./:/workspace
    environment:
      - MONGO_URI=mongodb://mongo:27017/?directConnection=true
      - MONGO_DB=radar_combustivel
    command: ["python", "seed/seed_radar_combustivel.py"]
    restart: "no"
    depends_on:
      mongo-init:
        condition: service_completed_successfully

  pipeline:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: lab-pipeline
    working_dir: /workspace
    volumes:
      - ./:/workspace
    environment:
      - MONGO_URI=mongodb://mongo:27017/?directConnection=true
      - MONGO_DB=radar_combustivel
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    command: ["python", "pipeline/pipeline_radar.py"]
    restart: "no"
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  streamlit:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: lab-streamlit
    working_dir: /workspace
    volumes:
      - ./:/workspace
    environment:
      - MONGO_URI=mongodb://mongo:27017/?directConnection=true
      - MONGO_DB=radar_combustivel
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "8501:8501"
    command: >
      streamlit run app/dashboard.py
        --server.port 8501
        --server.address 0.0.0.0
        --server.headless true
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

volumes:
  mongo_data:
  redis_data:
